name: Python Lint

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ricardochaves/python-lint@v1.4.0
        with:
          use-pylint: false
          use-black: false
          use-mypy: false
          use-isort: false
          extra-pycodestyle-options: "--max-line-length=500"
          extra-flake8-options: "--max-line-length=500"